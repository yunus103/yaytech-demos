<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Önizleme yayında değil · YayTech Studio</title>
  <style>
    :root { --bg: #f6f5f2; --ink: #1c1c1a; --muted: #6b6a66; --line: #dddbd5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151514; --ink: #f1efe9; --muted: #9c9a94; --line: #2c2b29; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 420px; }
    h1 { font-size: 1.375rem; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0; color: var(--muted); }
    a {
      display: inline-block; margin-top: 28px; padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 500; letter-spacing: .02em;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Bu önizleme artık yayında değil</h1>
    <p>Aradığınız tasarım önizlemesi kaldırılmış veya hiç oluşturulmamış.</p>
    <a href="https://yaytechstudio.com">yaytechstudio.com</a>
  </main>
</body>
</html>
